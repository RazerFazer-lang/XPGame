name: XPGame CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Multiplayer integration - multi-bot connection test
        run: npm run test:integration
      - name: Smoke test multiplayer server
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/xpgame-ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:3000/health >/dev/null; then
              echo "XPGame server health check passed."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "XPGame server exited during startup:" >&2
              cat /tmp/xpgame-ci-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          echo "XPGame server did not become ready:" >&2
          cat /tmp/xpgame-ci-server.log >&2 || true
          exit 1
